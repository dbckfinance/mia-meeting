name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install

      - name: Build llama-helper sidecar
        working-directory: .
        shell: pwsh
        run: |
          Write-Host "Building llama-helper sidecar (CPU-only)..."
          cargo build --release -p llama-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item "target/release/llama-helper.exe" -Destination "frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe"
          Get-ChildItem "frontend/src-tauri/binaries/"

      - name: Disable updater artifacts for unsigned CI
        working-directory: .
        run: node -e "const fs=require('fs'); const p='frontend/src-tauri/tauri.conf.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.bundle.createUpdaterArtifacts=false; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"

      - name: Build Tauri (CPU)
        run: pnpm tauri:build:cpu
        env:
          NEXT_PUBLIC_MIA_API_URL: https://www.m-ia.app
          NEXT_PUBLIC_MIA_SUPABASE_URL: https://idlhouaracvkzqtklzbp.supabase.co
          NEXT_PUBLIC_MIA_SUPABASE_ANON_KEY: ${{ secrets.MIA_SUPABASE_ANON_KEY }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mia-meeting-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
